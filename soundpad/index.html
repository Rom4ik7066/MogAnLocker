          this.toast(I18n.t("exportDone"));
        } catch(e) { if(e&&e.name==="AbortError")return;this.toast(I18n.t("exportUnavailable"),"error"); }
      }
      async importBoard(file) {
        try {
          if(file.size>300*1024*1024)throw new Error("large");
          const all=await file.arrayBuffer(),bytes=new Uint8Array(all);
          if(new TextDecoder().decode(bytes.subarray(0,5))!=="LUMA1")throw new Error("header");
          const hlen=new DataView(all).getUint32(5);if(hlen>bytes.length-9)throw new Error("header");
          const header=JSON.parse(new TextDecoder().decode(bytes.subarray(9,9+hlen)));
          if(header.format!=="LUMA"||header.version!==1||!Array.isArray(header.blobs))throw new Error("schema");
          const imported=this.app.store.validateState(header.state);if(!imported)throw new Error("state");
          const entries=[],validBlobIds=new Set();
          for(const b of header.blobs) {
            if(!b||typeof b.id!=="string"||!Number.isInteger(b.size)||b.size<1||b.size>MAX_FILE||!Number.isInteger(b.offset)||b.offset<0)continue;
            const start=9+hlen+b.offset,end=start+b.size;if(end>bytes.length)continue;
            const blob=new Blob([bytes.slice(start,end)],{type:typeof b.type==="string"?b.type:"application/octet-stream"});
            entries.push([b.id,blob]);validBlobIds.add(b.id);
          }
          imported.tiles=imported.tiles.filter(t=>validBlobIds.has(t.blobId));
          if(!imported.tiles.length)throw new Error("empty");
          imported.banks.forEach(b=>b.tileIds=imported.tiles.filter(t=>t.bankId===b.id).map(t=>t.id));
          const merge=confirm(I18n.t("importAsk"));
          let next=imported, writes=entries;
          if(merge) {
            next=structuredClone(this.app.state);const bankMap=new Map();
            imported.banks.forEach(b=>{const nb={...b,id:uid(),tileIds:[]};bankMap.set(b.id,nb.id);next.banks.push(nb);});
            const blobMap=new Map(entries.map(([id])=>[id,uid()]));
            imported.tiles.forEach(t=>{const nt={...t,id:uid(),bankId:bankMap.get(t.bankId),blobId:blobMap.get(t.blobId)};next.tiles.push(nt);next.banks.find(b=>b.id===nt.bankId).tileIds.push(nt.id);});
            writes=entries.map(([id,blob])=>[blobMap.get(id),blob]);
          }
          await this.app.commit(writes,merge?[]:"all",next);
          this.render();this.toast(I18n.t("imported"));if(imported.tiles.length!==(header.state.tiles||[]).length)this.toast(I18n.t("importedSome"));
        } catch(e) { this.toast(`${I18n.t("badAudio",{name:file.name})} ${I18n.t("importedSome")}`,"error"); }
      }
      async resetBoard() {
        if(!confirm(I18n.t("resetAsk")))return;
        this.app.audio.stopAll();await this.app.store.clear();this.app.state=initialState();this.app.state.prefs.theme="dark";this.app.pendingDelete=[];
        try {const demo=await createDemo();const b=this.app.state.banks[0];for(let i=0;i<demo.length;i++){const [name,blob]=demo[i],id=uid(),t={id,blobId:id,bankId:b.id,name,color:PALETTE[i],volume:1,mode:"once",key:"",wave:await wavPeaks(blob)};this.app.state.tiles.push(t);b.tileIds.push(id);this.app.pendingWrites.push([id,blob]);}
          await this.app.commit(this.app.pendingWrites);this.app.pendingWrites=[];this.render();this.el.settings.close();
        }catch(_){this.toast(I18n.t("statusError"),"error");}
      }
      async initOutputSelection() {
        const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
        const ctx=this.app.audio.ensureContext();if(!ctx)return;
        const canPrimary=typeof ctx.setSinkId==="function";
        const canSecondary=typeof HTMLMediaElement.prototype.setSinkId==="function"&&typeof ctx.createMediaStreamDestination==="function";
        const primaryRow=document.getElementById("outputRow"),secondaryRow=document.getElementById("secondaryOutputRow"),choose=document.getElementById("chooseOutput");
        primaryRow.classList.toggle("hidden",!canPrimary);secondaryRow.classList.toggle("hidden",!canSecondary);
        choose.classList.toggle("hidden",!navigator.mediaDevices||typeof navigator.mediaDevices.selectAudioOutput!=="function"||(!canPrimary&&!canSecondary));
        const primary=document.getElementById("outputSelect"),secondary=document.getElementById("secondaryOutputSelect");
        const appendOptions=(select,offLabel)=>{
          select.replaceChildren();
          const first=document.createElement("option");first.value="";first.textContent=offLabel;select.append(first);
          return select;
        };
        appendOptions(primary,I18n.lang==="ru"?"Системный выход":"System default");
        appendOptions(secondary,I18n.t("outputOff"));
        try {
          if(!navigator.mediaDevices||!navigator.mediaDevices.enumerateDevices)return;
          const outputs=(await navigator.mediaDevices.enumerateDevices()).filter(d=>d.kind==="audiooutput");
          outputs.forEach((d,i)=>{
            const label=d.label||`${I18n.lang==="ru"?"Выход":"Output"} ${i+1}`;
            [primary,secondary].forEach(select=>{const o=document.createElement("option");o.value=d.deviceId;o.textContent=label;select.append(o);});
          });
          primary.value=this.app.state.prefs.outputDevice||"";
          secondary.value=this.app.state.prefs.secondaryOutputDevice||"";
          if(canPrimary&&primary.value)try{await this.app.audio.setPrimaryOutput(primary.value);}catch(_){}
          if(canSecondary&&secondary.value)try{await this.app.audio.setSecondaryOutput(secondary.value);}catch(_){}
          if(!primary.dataset.bound) {
            primary.addEventListener("change",async()=>{
              this.app.state.prefs.outputDevice=primary.value;
              try{await this.app.audio.setPrimaryOutput(primary.value);this.app.saveSoon();}catch(_){this.toast(I18n.t("statusError"),"error");}
            });primary.dataset.bound="1";
          }
          if(!secondary.dataset.bound) {
            secondary.addEventListener("change",async()=>{
              this.app.state.prefs.secondaryOutputDevice=secondary.value;
              try{await this.app.audio.setSecondaryOutput(secondary.value);this.app.saveSoon();}catch(_){this.toast(I18n.t("statusError"),"error");}
            });secondary.dataset.bound="1";
          }
        } catch(_){}
      }
      async chooseOutput() {
        try {
          if(!navigator.mediaDevices||typeof navigator.mediaDevices.selectAudioOutput!=="function")return;
          const device=await navigator.mediaDevices.selectAudioOutput();
          const secondaryRow=document.getElementById("secondaryOutputRow"),useSecondary=!secondaryRow.classList.contains("hidden");
          const target=document.getElementById(useSecondary?"secondaryOutputSelect":"outputSelect");
          let option=[...target.options].find(o=>o.value===device.deviceId);
          if(!option){option=document.createElement("option");option.value=device.deviceId;option.textContent=device.label||"Audio output";target.append(option);}
          target.value=device.deviceId;target.dispatchEvent(new Event("change",{bubbles:true}));
        } catch(e) { if(e&&e.name!=="NotAllowedError"&&e.name!=="AbortError")this.toast(I18n.t("statusError"),"error"); }
      }
    }

    class PWA {
      static async init(ui) {
        if(!("serviceWorker" in navigator)||!/^https?:$/.test(location.protocol))return;
        try {
          const registration=await navigator.serviceWorker.register("./sw.js",{scope:"./"});
          if(registration.waiting)PWA.offerUpdate(registration,ui);
          registration.addEventListener("updatefound",()=>{
            const worker=registration.installing;if(!worker)return;
            worker.addEventListener("statechange",()=>{if(worker.state==="installed"&&navigator.serviceWorker.controller)PWA.offerUpdate(registration,ui);});
          });
          navigator.serviceWorker.addEventListener("controllerchange",()=>{if(!PWA.reloading){PWA.reloading=true;location.reload();}});
        } catch (_) { ui.toast(I18n.lang==="ru"?"Не удалось включить офлайн-режим. Приложение продолжает работать.":"Offline mode could not be enabled. The app is still available."); }
      }
      static offerUpdate(registration,ui) {
        const box=document.createElement("div");box.className="toast";
        const text=document.createElement("span");text.textContent=I18n.t("update");
        const button=document.createElement("button");button.className="button";button.type="button";button.textContent=I18n.t("apply");
        button.addEventListener("click",()=>{if(registration.waiting)registration.waiting.postMessage({type:"SKIP_WAITING"});});
        box.append(text,document.createTextNode(" "),button);ui.el.toast.append(box);
      }
    }

    class App {
      constructor() {
        this.state=initialState();this.store=new Store();this.pendingDelete=[];this.pendingWrites=[];
        this.ui=new UI(this);
        this.audio=new AudioEngine(this.store,{onVoice:(id,on)=>this.ui.voice(id,on),onProgress:(id,p)=>this.ui.onProgress(id,p),clearProgress:()=>this.ui.clearProgress()});
        this.input=new Input(this.ui);this.saveTimer=0;
      }
      async init() {
        await this.store.open();
        try {
          const saved=await this.store.load();
          if(saved)this.state=saved;
          else await this.seed();
        } catch (_) {
          this.store.persistent=false;this.state=initialState();await this.seed();
        }
        I18n.set(this.state.prefs.lang||I18n.lang);
        this.ui.init();this.input.init();
        this.audio.warm(this.ui.visibleTiles());
        PWA.init(this.ui);
        window.addEventListener("luma-external-change",()=>this.reloadExternal());
      }
      async seed() {
        this.state=initialState();const writes=[];
        try {
          const demo=await createDemo(),bank=this.state.banks[0];
          const ruNames=["Бочка","Снейр","Хлопок","Лазер","Колокольчик","Импульс","Римшот","Шум"];
          for(let i=0;i<demo.length;i++) {
            const [name,blob]=demo[i],id=uid(),tile={id,blobId:id,bankId:bank.id,name:I18n.lang==="ru"?ruNames[i]:name,color:PALETTE[i],volume:1,mode:"once",key:"",wave:await wavPeaks(blob)};
            this.state.tiles.push(tile);bank.tileIds.push(id);writes.push([id,blob]);
          }
          await this.store.save(this.state,writes);
        } catch (_) {
          this.store.persistent=false;
          this.store.db=null;
          this.store.memory={state:structuredClone(this.state),blobs:new Map(writes)};
        }
      }
      async commit(blobWrites=[],deleteIds=this.pendingDelete,nextState=this.state) {
        const normalized=this.store.validateState(nextState);
        if(!normalized)throw new Error("Invalid state");
        try {
          await this.store.save(normalized,blobWrites,deleteIds);
          this.state=normalized;
        } catch(e) {
          let previous=[];
          if(this.store.db) { try { previous=await this.store.allBlobs(); } catch (_) {} }
          this.store.memory={state:structuredClone(normalized),blobs:new Map(previous)};
          if(deleteIds==="all")this.store.memory.blobs.clear();
          else (deleteIds||[]).forEach(id=>this.store.memory.blobs.delete(id));
          blobWrites.forEach(([id,blob])=>this.store.memory.blobs.set(id,blob));
          this.store.db=null;this.store.persistent=false;this.state=normalized;
          this.ui.toast(e&&e.kind==="quota"?I18n.t("savedQuota"):I18n.t("savedMemory"),"error");
        }
        if(deleteIds===this.pendingDelete)this.pendingDelete=[];
        this.ui.updateCounts();
      }
      saveSoon() {
        clearTimeout(this.saveTimer);
        this.saveTimer=setTimeout(()=>this.commit().catch(e=>this.ui.storageError(e)),180);
      }
      async reloadExternal() {
        if(this.audio.voices.length)return;
        try {const fresh=await this.store.load();if(fresh){this.state=fresh;I18n.set(fresh.prefs.lang);this.ui.applyTheme();this.ui.applyText();this.ui.render();this.audio.warm(this.ui.visibleTiles());}}
        catch(_){this.ui.toast(I18n.t("statusError"),"error");}
      }
    }

    let app;
    document.addEventListener("DOMContentLoaded",()=>{app=new App();app.init().catch(()=>{document.getElementById("toastRegion").textContent=I18n.t("statusError");});});
  })();
  </script>

</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand" aria-label="Luma Soundpad">
        <svg class="brand-mark" viewBox="0 0 40 40" aria-hidden="true"><path d="M7 7h11v11H7zM22 7h11v11H22zM7 22h11v11H7zM22 22h11v11H22z" fill="currentColor"/><circle cx="27.5" cy="12.5" r="2" fill="#171a1c"/><circle cx="12.5" cy="27.5" r="2" fill="#171a1c"/></svg>
        <span class="brand-name">Luma</span>
      </div>
      <nav class="bank-nav" id="bankNav" aria-label="Банки звуков"></nav>
      <button class="bank-add" id="addBank" type="button" aria-label="Создать банк" title="Создать банк">+</button>
      <div class="tools">
        <input class="search hidden" id="search" type="search" aria-label="Поиск звуков" placeholder="Найти звук">
        <button class="icon-button" id="settingsButton" type="button" aria-label="Настройки" title="Настройки"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-1.7 1.7-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.5v.2h-2.4v-.2a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.9.3l-.1.1L8 17l.1-.1a1.7 1.7 0 0 0 .3-1.9 1.7 1.7 0 0 0-1.5-1H6.7v-2.4h.2a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.9L8 8.6l1.7-1.7.1.1a1.7 1.7 0 0 0 1.9.3 1.7 1.7 0 0 0 1-1.5v-.2h2.4v.2a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.9-.3l.1-.1 1.7 1.7-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.5 1h.2V14h-.2a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
      </div>
    </header>
    <section class="transport" aria-label="Управление воспроизведением">
      <button class="button stop-button" id="stopAll" type="button" aria-label="Стоп всё"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="5" width="14" height="14" rx="2"/></svg><span id="stopText">Стоп всё</span></button>
      <label class="master"><span class="master-label" id="masterLabel">Громкость</span><input id="masterVolume" type="range" min="0" max="100" value="80" aria-label="Общая громкость"><span id="masterValue">80</span></label>
      <button class="button edit-toggle" id="editToggle" type="button" aria-pressed="false" aria-label="Правка"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m14 6 4 4M4 20l4-.8L19 8a2.1 2.1 0 0 0-3-3L5 16z"/></svg><span id="editText">Правка</span></button>
      <label class="file-label button primary" for="addFiles" id="addFilesLabel"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span id="addText" class="button-text">Добавить</span><input id="addFiles" type="file" multiple accept="audio/*,.wav,.wave,.mp3,.m4a,.aac,.ogg,.oga,.opus,.flac,.aif,.aiff,.caf,.weba,.3gp,.amr"></label>
    </section>
    <section class="grid-wrap">
      <div class="pad-grid" id="padGrid" aria-label="Звуковые плитки"></div>
    </section>
    <footer class="bottom-bar"><span class="status" id="status">Готово к звуку</span><span id="tileCount"></span></footer>
  </main>
  <div class="drop-overlay" id="dropOverlay" aria-hidden="true">Перетащите аудиофайлы сюда</div>
  <div class="toast-region" id="toastRegion" aria-live="polite"></div>
  <dialog id="editDialog" aria-labelledby="editTitle">
    <form class="dialog-content" id="editForm">
      <div class="dialog-head"><h2 id="editTitle">Настроить звук</h2><button class="icon-button" type="button" data-close="editDialog" aria-label="Закрыть">×</button></div>
      <label class="field"><span id="nameLabel">Название</span><input id="tileName" maxlength="80" required></label>
      <div class="two-col">
        <label class="field"><span id="colorLabel">Цвет плитки</span><input id="tileColor" type="color" value="#c8f169"></label>
        <label class="field"><span id="modeLabel">Режим</span><select id="tileMode"><option value="once">Один раз</option><option value="hold">Пока держу</option><option value="loop">Петля вкл/выкл</option></select></label>
      </div>
      <label class="field"><span id="volumeLabel">Громкость плитки</span><div class="volume-row"><input id="tileVolume" type="range" min="0" max="100" value="100"><span id="tileVolumeValue">100</span></div></label>
      <label class="field"><span id="keyLabel">Клавиша</span><button class="key-capture" id="keyCapture" type="button">Не назначена</button></label>
      <label class="field"><span id="replaceLabel">Заменить звук</span><input id="replaceFile" type="file" accept="audio/*,.wav,.wave,.mp3,.m4a,.aac,.ogg,.oga,.opus,.flac,.aif,.aiff,.caf,.weba,.3gp,.amr"></label>
      <div class="dialog-actions">
        <button class="button" id="moveLeft" type="button">Сдвинуть влево</button><button class="button" id="moveRight" type="button">Сдвинуть вправо</button>
        <span class="spacer"></span><button class="button danger" id="deleteTile" type="button">Удалить</button><button class="button primary" id="saveTile" type="submit">Сохранить</button>
      </div>
    </form>
  </dialog>
  <dialog id="settingsDialog" aria-labelledby="settingsTitle">
    <div class="dialog-content">
      <div class="dialog-head"><h2 id="settingsTitle">Настройки</h2><button class="icon-button" type="button" data-close="settingsDialog" aria-label="Закрыть">×</button></div>
      <label class="setting-row"><span id="themeLabel">Тема</span><select id="themeSelect"><option value="dark">Тёмная</option><option value="light">Светлая</option><option value="auto">Авто</option></select></label>
      <label class="setting-row"><span id="languageLabel">Язык</span><select id="languageSelect"><option value="ru">Русский</option><option value="en">English</option></select></label>
      <div class="setting-row"><span id="storageLabel">Занято</span><strong id="storageUsage">—</strong></div>
      <button class="button" id="manageBank" type="button">Управлять текущим банком</button>
      <div class="setting-actions">
        <button class="button" id="exportBoard" type="button">Экспортировать</button>
        <label class="file-label button" for="importFile" id="importLabel"><span id="importText">Импортировать</span><input id="importFile" type="file" accept=".luma,.json,application/json"></label>
        <button class="button danger" id="resetBoard" type="button">Сбросить всё</button>
      </div>
      <div class="hint" id="audioRouteHint"></div>
      <div class="hint" id="routeDetail"></div>
      <label class="setting-row hidden" id="outputRow"><span id="outputLabel">Устройство вывода</span><select id="outputSelect"></select></label>
      <label class="setting-row hidden" id="secondaryOutputRow"><span id="secondaryOutputLabel">Второй выход</span><select id="secondaryOutputSelect"><option value="">Выключен</option></select></label>
      <button class="button hidden" id="chooseOutput" type="button">Выбрать аудиовыход</button>
      <div class="hint" id="storageHint"></div>
    </div>
  </dialog>
  <dialog id="bankDialog" aria-labelledby="bankDialogTitle">
    <form class="dialog-content" id="bankForm"><div class="dialog-head"><h2 id="bankDialogTitle">Банк</h2><button class="icon-button" type="button" data-close="bankDialog" aria-label="Закрыть">×</button></div><label class="field"><span id="bankNameLabel">Название банка</span><input id="bankName" maxlength="40" required></label><div class="dialog-actions"><button class="button danger hidden" type="button" id="bankDelete">Удалить банк</button><span class="spacer"></span><button class="button primary" type="submit" id="bankSave">Сохранить</button></div></form>
  </dialog>
  
</body>
</html>
